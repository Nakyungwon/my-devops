# 이 파일의 값들이 templates/ 의 .Values.* 로 들어갑니다.
# 우선순위: --set / -f 로 준 값 > 이 파일 > 템플릿 기본값(없음)

# → templates/deployment.yaml: spec.replicas
replicaCount: 2

image:
  # → templates/deployment.yaml: image 앞부분
  #    .github/workflows/ci.yml 의 env.IMAGE 와 같은 값 (자동 동기화 아님, 손으로 맞춤)
  repo: ghcr.io/nakyungwon/my-devops
  # → templates/deployment.yaml: image 뒷부분. 값은 CI 가 빌드한 커밋 SHA.
  #    CI(bump 스텝)가 이 줄을 sed 로 갈아끼웁니다. 손으로 고칠 일 없습니다.
  tag: a1dd282a9af80c97a63ea0158668f3517441f6b6

service:
  # → templates/service.yaml: ports[0].nodePort (README 의 localhost:30080)
  nodePort: 30080

# → templates/deployment.yaml: containers[0].resources 에 통째로 들어감
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
