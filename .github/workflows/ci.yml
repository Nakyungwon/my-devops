name: build-and-deploy

# develop → dev 네임스페이스, main → prod 네임스페이스.
#
# app/ 변경만 트리거합니다.
# 아래 bump 스텝이 chart/ 를 커밋하는데, 그게 다시 이 워크플로를 부르면
# 무한 루프가 됩니다. 이 paths 필터가 그 루프를 끊습니다.
on:
  push:
    branches: [develop, main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write # chart/values-*.yaml 태그 커밋용
  packages: write # GHCR push용

env:
  # GHCR은 소문자만 받습니다. github.repository 는 대문자(Nakyungwon)가 섞여 있어 그대로 쓰면 실패합니다.
  IMAGE: ghcr.io/nakyungwon/my-devops # git 에서 제공하는 이미지 저장소

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 이미지는 develop 에서만 만듭니다.
      # main 에서 다시 빌드하면 prod 가 dev 에서 한 번도 안 돌아본 이미지를 받습니다.
      # 승격은 "새로 만들기"가 아니라 "검증된 것 그대로 옮기기"여야 합니다.
      - uses: docker/login-action@v3
        if: github.ref_name == 'develop'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        if: github.ref_name == 'develop'
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: bump image tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = main ]; then
            # 승격. develop 이 빌드해서 dev 에 띄워본 그 태그를 그대로 복사합니다.
            # values-dev.yaml 은 develop→main merge 로 같이 넘어옵니다.
            # 주의: app/ 을 develop 안 거치고 main 에 직접 push 하면 여기서
            #       옛날 태그가 복사됩니다. 승격은 항상 merge 로 하세요.
            FILE=chart/values-prod.yaml
            TAG=$(sed -n 's|^ *tag: *\(.*\)|\1|p' chart/values-dev.yaml)
            MSG="chore: promote ${TAG:0:7} to prod"
          else
            FILE=chart/values-dev.yaml
            TAG=$GITHUB_SHA
            MSG="chore: deploy ${TAG:0:7}"
          fi
          # values 파일마다 tag: 는 한 줄뿐이라 sed 가 안전합니다.
          sed -i "s|^\( *tag: \).*|\1${TAG}|" "$FILE"
          grep -n "tag:" "$FILE"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          # 태그가 그대로면 커밋할 게 없어 실패하므로 먼저 확인
          if git diff --cached --quiet; then
            echo "no tag change, skipping commit"
          else
            git commit -m "$MSG"
            git push
          fi
