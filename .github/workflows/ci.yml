name: build-and-deploy

# app/ 변경만 트리거합니다.
# 아래 bump 스텝이 manifests/ 를 커밋하는데, 그게 다시 이 워크플로를 부르면
# 무한 루프가 됩니다. 이 paths 필터가 그 루프를 끊습니다.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write # manifests/ 태그 커밋용
  packages: write # GHCR push용

env:
  # GHCR은 소문자만 받습니다. github.repository 는 대문자(Nakyungwon)가 섞여 있어 그대로 쓰면 실패합니다.
  IMAGE: ghcr.io/nakyungwon/my-devops

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: bump image tag in manifests
        run: |
          set -euo pipefail
          sed -i "s|^\( *image: \).*|\1${IMAGE}:${GITHUB_SHA}|" manifests/deployment.yaml
          grep -n "image:" manifests/deployment.yaml

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/deployment.yaml
          # 태그가 그대로면 커밋할 게 없어 실패하므로 먼저 확인
          if git diff --cached --quiet; then
            echo "no manifest change, skipping commit"
          else
            git commit -m "chore: deploy ${GITHUB_SHA:0:7}"
            git push
          fi
