name: bump-tag
description: chart/values-*.yaml 의 image.tag 를 바꾸고 커밋·푸시합니다.

# composite action = 여러 step 을 하나로 묶은 "재사용 가능한 step".
# reusable workflow(on: workflow_call) 와 달리 별도 job 이 아니라 호출한 job 안에서
# 그대로 실행되므로 러너·checkout 을 공유합니다.
#
# 호출 방법 (checkout 뒤에):
#   - uses: ./.github/actions/bump-tag
#     with:
#       file: chart/values-dev.yaml
#       tag: ${{ github.sha }}
#       message: "chore: deploy abc1234"

inputs:
  file:
    description: 갱신할 values 파일 경로
    required: true
  tag:
    description: 새 이미지 태그
    required: true
  message:
    description: 커밋 메시지
    required: true

runs:
  using: composite
  steps:
    - shell: bash # composite 의 run 은 shell 을 반드시 명시해야 합니다.
      # inputs 를 ${{ }} 로 스크립트에 직접 박지 않고 env 로 넘깁니다.
      # 직접 박으면 입력값이 쉘 코드로 해석되는 인젝션 구멍이 생깁니다.
      env:
        FILE: ${{ inputs.file }}
        TAG: ${{ inputs.tag }}
        MSG: ${{ inputs.message }}
      run: |
        set -euo pipefail
        # values 파일마다 tag: 는 한 줄뿐이라 sed 가 안전합니다.
        sed -i "s|^\( *tag: \).*|\1${TAG}|" "$FILE"
        grep -n "tag:" "$FILE"

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$FILE"
        # 태그가 그대로면 커밋할 게 없어 실패하므로 먼저 확인
        if git diff --cached --quiet; then
          echo "no tag change, skipping commit"
        else
          git commit -m "$MSG"
          git push
        fi
