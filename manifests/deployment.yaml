apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # 아래 한 줄을 CI가 GHCR 태그로 교체합니다 (파일 내 유일해야 sed가 안전).
          image: ghcr.io/nakyungwon/my-devops:c69fa6f1fd8fe4069a25bdce292ba0d6ea346505
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
