apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nakyungwon/my-devops.git
    targetRevision: main
    # manifests/ 만 바라봅니다. 이 파일이 여기 들어있으면 ArgoCD가 자기 자신을
    # default 네임스페이스에 만들려 해서 깨집니다. 그래서 디렉터리를 분리했습니다.
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true # git에서 지운 리소스는 클러스터에서도 삭제
      selfHeal: true # kubectl로 직접 바꿔도 git 상태로 되돌림
