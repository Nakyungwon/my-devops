apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nakyungwon/my-devops.git
    targetRevision: main
    # chart/ 만 바라봅니다. helm 차트라는 건 ArgoCD가 Chart.yaml 보고 알아서 판단합니다.
    # 릴리스 이름 = 이 Application 의 metadata.name → "web" → 템플릿의 .Release.Name
    # 이 파일이 chart/ 안에 들어있으면 helm 이 이것까지 렌더링해서 ArgoCD가 자기 자신을
    # default 네임스페이스에 만들려 해서 깨집니다. 그래서 디렉터리를 분리했습니다.
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true # git에서 지운 리소스는 클러스터에서도 삭제
      selfHeal: true # kubectl로 직접 바꿔도 git 상태로 되돌림
